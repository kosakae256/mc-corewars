<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>pve3 動きの工房</title>
<style>
  :root { color-scheme: dark; --bg:#15171c; --panel:#1e2128; --line:#2c313b; --ink:#e6e9ef; --dim:#9aa3b2; --key:#7fd1a0; --warm:#e0a濃; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.6 "Segoe UI","Yu Gothic UI",system-ui,sans-serif; }
  header { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header b { color:var(--key); margin-right:4px; }
  main { display:grid; grid-template-columns: 1fr 400px; height:calc(100vh - 96px); }
  #view { background:#0f1116; display:flex; align-items:center; justify-content:center; }
  canvas#cv { cursor:grab; }
  aside { border-left:1px solid var(--line); overflow-y:auto; padding:10px 14px; background:var(--panel); }
  footer { border-top:1px solid var(--line); padding:6px 14px; display:flex; gap:10px; align-items:center; background:var(--panel); }
  select, button, input[type=text] { background:#262a33; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--key); }
  button.on { border-color:var(--key); color:var(--key); }
  h2 { font-size:12px; margin:14px 0 6px; color:var(--key); letter-spacing:.04em; }
  .row { display:grid; grid-template-columns: 16px 1fr 62px; gap:8px; align-items:center; margin:2px 0; }
  .row span { color:var(--dim); }
  input[type=range] { width:100%; }
  input[type=number] { width:62px; background:#262a33; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:inherit; }
  textarea { width:100%; height:150px; background:#12141a; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.5 ui-monospace,Consolas,monospace; }
  .hint { color:var(--dim); font-size:12px; margin:6px 0 0; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  .chips button { padding:2px 7px; font-size:12px; }
  .chips button.has { color:var(--key); }
  #track { flex:1; height:34px; background:#12141a; border:1px solid var(--line); border-radius:6px; position:relative; cursor:pointer; }
  #track .k { position:absolute; top:4px; width:3px; height:26px; background:var(--key); border-radius:2px; transform:translateX(-1px); }
  #track .k.on { background:#fff; }
  #track .now { position:absolute; top:0; width:1px; height:34px; background:#ff7b6b; }
</style>
</head>
<body>
<header>
  <b>動きの工房</b>
  <label>モブ <select id="mob"></select></label>
  <label>右手 <select id="item"></select></label>
  <label>左手 <select id="item2"></select></label>
  <label>倍率 <input id="zoom" type="range" min="2" max="16" step="0.5" value="7" style="width:90px"></label>
  <button id="reset">向きを戻す</button>
  <label>読み込み <select id="load"></select></label>
</header>
<main>
  <div id="view"><canvas id="cv" width="600" height="600"></canvas></div>
  <aside>
    <h2>骨（印は動かした所）</h2>
    <div class="chips" id="bones"></div>
    <div id="sliders"></div>
    <h2>書き出し</h2>
    <label>名前 <input id="name" type="text" value="animation.pve3.new" style="width:230px"></label>
    <p class="hint">長さ <input id="len" type="number" value="1" step="0.05" style="width:60px"> 秒 ／
      <label><input id="loop" type="checkbox" checked> くり返す</label></p>
    <textarea id="out" readonly></textarea>
    <p>
      <button id="copy">写す</button>
      <button id="save">ファイルに落とす</button>
      <button id="clear">この時刻を消す</button>
    </p>
  </aside>
</main>
<footer>
  <button id="play">▶ 動かす</button>
  <div id="track"><div class="now" id="now"></div></div>
  <span id="tlabel" style="width:90px; text-align:right; color:var(--dim)">0.00 秒</span>
  <button id="addkey">ここに山を打つ</button>
</footer>

        const depth = (pts[0][2] + pts[1][2] + pts[2][2] + pts[3][2]) / 4 + 0.02;
        /* 広い面（左右）は絵、細い縁は色で塗る */
        if (fi === 2 || fi === 3) quads.push({ pts: pts, img: held, flip: fi === 3, depth: depth, bone: b.name });
        else quads.push({ pts: pts, light: 0.5 + 0.4 * Math.max(0, nrm[1]), depth: depth, bone: b.name });
      });
    }
  });
  quads.sort((a, b) => a.depth - b.depth);
  quads.forEach(q => {
    if (q.img) {
      /* 面がこちらを向いていないと、絵が裏返る。向きで角の取り方を変える */
      const c = q.pts, area = (c[1][0]-c[0][0])*(c[2][1]-c[0][1]) - (c[2][0]-c[0][0])*(c[1][1]-c[0][1]);
      const p0 = q.flip ? c[2] : c[3], p1 = q.flip ? c[3] : c[2], p3 = q.flip ? c[1] : c[0];
      if (Math.abs(area) < 1) return;   /* 真横から見た瞬間は描かない */
      ctx.save();
      ctx.beginPath();
      c.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.closePath();
      ctx.clip();
      ctx.setTransform((p1[0] - p0[0]) / q.img.width, (p1[1] - p0[1]) / q.img.width,
                       (p3[0] - p0[0]) / q.img.height, (p3[1] - p0[1]) / q.img.height, p0[0], p0[1]);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(q.img, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.restore();
      return;
    }
    const on = q.bone === picked;
    const v = Math.round(150 * q.light);
    ctx.fillStyle = on ? "rgb(" + Math.round(v * .8) + "," + Math.round(v * 1.5) + "," + Math.round(v * 1.1) + ")"
                       : "rgb(" + v + "," + v + "," + Math.round(v * 1.08) + ")";
    ctx.strokeStyle = "rgba(0,0,0,.45)";
    ctx.beginPath();
    q.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
}

const AX = [["rx", "X"], ["ry", "Y"], ["rz", "Z"], ["px", "X"], ["py", "Y"], ["pz", "Z"]];
function sliders() {
  const box = el("sliders");
  box.innerHTML = "";
  if (!picked) { box.innerHTML = '<p class="hint">上から骨を選ぶ</p>'; return; }
  const k = String(near(time));
  if (!keys[k]) keys[k] = {};
  if (!keys[k][picked]) keys[k][picked] = {};
  const p = keys[k][picked];
  ["回す（度）", "寄せる（1 ＝ 1/16 マス）"].forEach((title, half) => {
    const h = document.createElement("h2");
    h.textContent = title;
    box.append(h);
    AX.slice(half * 3, half * 3 + 3).forEach(pair => {
      const key = pair[0], isRot = key[0] === "r";
      const row = document.createElement("div");
      row.className = "row";
      const s = document.createElement("span");
      s.textContent = pair[1];
      const r = document.createElement("input");
      r.type = "range";
      r.min = isRot ? -180 : -24;
      r.max = isRot ? 180 : 24;
      r.step = isRot ? 1 : 0.5;
      r.value = p[key] || 0;
      const n = document.createElement("input");
      n.type = "number";
      n.value = r.value;
      n.step = r.step;
      const set = v => { p[key] = Number(v); r.value = v; n.value = v; draw(); dump(); chips(); };
      r.oninput = () => set(r.value);
      n.oninput = () => set(n.value);
      row.append(s, r, n);
      box.append(row);
    });
  });
}

function moved(bone) {
  return times().some(t => {
    const p = (keys[String(t)] || {})[bone];
    return p && KEYS6.some(k => p[k]);
  });
}

function chips() {
  const box = el("bones");
  box.innerHTML = "";
  bonesOf().forEach(b => {
    const t = document.createElement("button");
    t.textContent = b.name;
    t.className = (b.name === picked ? "on " : "") + (moved(b.name) ? "has" : "");
    t.onclick = () => { picked = b.name; chips(); sliders(); draw(); };
    box.append(t);
  });
}

function dump() {
  const ts = times();
  const bones = {};
  ts.forEach(t => {
    Object.entries(keys[String(t)] || {}).forEach(([bone, p]) => {
      const rv = [p.rx || 0, p.ry || 0, p.rz || 0], pv = [p.px || 0, p.py || 0, p.pz || 0];
      if (!rv.some(Boolean) && !pv.some(Boolean)) return;
      bones[bone] = bones[bone] || {};
      if (rv.some(Boolean)) (bones[bone].rotation = bones[bone].rotation || {})[t.toFixed(2)] = rv.map(v => v + " - this");
      if (pv.some(Boolean)) (bones[bone].position = bones[bone].position || {})[t.toFixed(2)] = pv.map(v => v + " - this");
    });
  });
  /* 山が 1 つだけなら、時刻を書かずに置きっぱなしの姿勢にする */
  if (ts.length === 1) {
    Object.values(bones).forEach(b => {
      if (b.rotation) b.rotation = Object.values(b.rotation)[0];
      if (b.position) b.position = Object.values(b.position)[0];
    });
  }
  const one = { loop: el("loop").checked, bones: bones };
  if (ts.length > 1) one.animation_length = Number(el("len").value);
  const doc = { format_version: "1.8.0", animations: {} };
  doc.animations[el("name").value] = one;
  el("out").value = JSON.stringify(doc, null, 2);
}

function drawTrack() {
  const tr = el("track");
  tr.querySelectorAll(".k").forEach(x => x.remove());
  times().forEach(t => {
    const d = document.createElement("div");
    d.className = "k" + (Math.abs(t - near(time)) < 1e-6 ? " on" : "");
    d.style.left = (t / Math.max(0.01, length) * 100) + "%";
    tr.append(d);
  });
  el("now").style.left = (time / Math.max(0.01, length) * 100) + "%";
  el("tlabel").textContent = time.toFixed(2) + " 秒";
}

/* ---- 読み込み（このパックのアニメを開く） ---- */
function loadAnim(name) {
  const a = DATA.anims[name];
  if (!a) return;
  keys = {};
  length = a.length || 1;
  el("len").value = length;
  el("loop").checked = a.loop !== false;
  el("name").value = name;
  const put = (t, bone, kind, arr) => {
    const k = String(Number(t));
    keys[k] = keys[k] || {};
    keys[k][bone] = keys[k][bone] || {};
    const pre = kind === "rotation" ? "r" : "p";
    ["x", "y", "z"].forEach((ax, i) => {
      const v = Array.isArray(arr) ? arr[i] : 0;
      const m = typeof v === "string" ? v.match(/^\s*(-?\d+(?:\.\d+)?)/) : null;
      keys[k][bone][pre + ax] = typeof v === "number" ? v : (m ? Number(m[1]) : 0);
    });
  };
  Object.entries(a.bones).forEach(([bone, t]) => {
    ["rotation", "position"].forEach(kind => {
      const v = t[kind];
      if (!v) return;
      if (Array.isArray(v)) put(0, bone, kind, v);
      else Object.entries(v).forEach(([tt, arr]) => put(tt, bone, kind, Array.isArray(arr) ? arr : (arr && arr.post) || []));
    });
  });
  if (!Object.keys(keys).length) keys = { "0": {} };
  time = 0;
  picked = null;
  chips(); sliders(); dump(); drawTrack(); draw();
}

/* ---- 組み立て ---- */
const mobSel = el("mob");
DATA.entities.forEach(e => { const o = document.createElement("option"); o.textContent = e.id; mobSel.append(o); });
const ITEMS = [{ id: "（無し）", tex: "" }].concat(DATA.items);
[el("item"), el("item2")].forEach(sel => ITEMS.forEach(i => { const o = document.createElement("option"); o.textContent = i.id; sel.append(o); }));
const loadSel = el("load");
["（新しく作る）"].concat(Object.keys(DATA.anims).sort()).forEach(n => { const o = document.createElement("option"); o.textContent = n; loadSel.append(o); });

mobSel.onchange = () => { picked = null; chips(); sliders(); draw(); };
el("item").onchange = () => { const i = ITEMS[el("item").selectedIndex]; imgR = i.tex ? image(i.tex) : null; draw(); };
el("item2").onchange = () => { const i = ITEMS[el("item2").selectedIndex]; imgL = i.tex ? image(i.tex) : null; draw(); };
loadSel.onchange = () => { if (loadSel.selectedIndex > 0) loadAnim(loadSel.value || loadSel.options[loadSel.selectedIndex].textContent); };
el("zoom").oninput = e => { zoom = Number(e.target.value); draw(); };
el("reset").onclick = () => { yaw = 35; pitch = 14; draw(); };
el("len").oninput = e => { length = Number(e.target.value) || 1; dump(); drawTrack(); };
el("loop").onchange = dump;
el("name").oninput = dump;
el("copy").onclick = () => navigator.clipboard.writeText(el("out").value);
el("save").onclick = () => {
  const b = new Blob([el("out").value], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = el("name").value.replace(/^animation\./, "").replace(/\./g, "_") + ".animation.json";
  a.click();
};
el("clear").onclick = () => {
  const k = String(near(time));
  if (times().length > 1) delete keys[k]; else keys[k] = {};
  sliders(); dump(); chips(); drawTrack(); draw();
};
el("addkey").onclick = () => {
  const k = String(Number(time.toFixed(2)));
  if (!keys[k]) keys[k] = JSON.parse(JSON.stringify(cur()));
  sliders(); dump(); drawTrack(); draw();
};
el("track").onclick = e => {
  const r = el("track").getBoundingClientRect();
  time = Math.max(0, Math.min(length, (e.clientX - r.left) / r.width * length));
  sliders(); drawTrack(); draw();
};
el("play").onclick = () => {
  playing = !playing;
  el("play").textContent = playing ? "■ 止める" : "▶ 動かす";
  if (playing) tick();
};
let last = 0;
function tick(now) {
  if (!playing) return;
  if (last) {
    time += (now - last) / 1000;
    if (time > length) time = el("loop").checked ? 0 : length;
  }
  last = now;
  drawTrack(); draw();
  requestAnimationFrame(tick);
}
let drag = null;
cv.onpointerdown = e => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => {
  if (!drag) return;
  yaw += (e.clientX - drag[0]) * 0.6;
  pitch += (e.clientY - drag[1]) * 0.4;
  drag = [e.clientX, e.clientY];
  draw();
};
cv.onpointerup = () => { drag = null; last = 0; };
chips(); sliders(); dump(); drawTrack(); draw();
</script>
</body>
