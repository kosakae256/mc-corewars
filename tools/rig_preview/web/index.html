<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="rig-token" content="__TOKEN__"><title>Steve Motion — アニメーション編集</title><link rel="stylesheet" href="/editor.css"></head>
<body>
<header><div><strong>Steve Motion</strong><span class="subtitle">スティーブのアニメーション編集</span></div><nav><button id="import">読み込む</button><button id="project">プロジェクト保存</button><button id="export">アニメJSONを書き出す</button><button id="save">散弾に保存</button><button id="deploy" class="primary">保存してゲームへ配置</button></nav></header>
<div class="toolbar"><select id="clips" aria-label="アニメーション"></select><button id="new">新規</button><button id="duplicate">複製</button><button id="rename">名前を変更</button><button id="delete-clip">削除</button><span class="spacer"></span><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button><button id="reload">パックから読み直す</button></div>
<main>
<aside class="bones"><h2>動かす部位</h2><p id="target-label" class="muted"></p><div id="bones"></div></aside>
<section class="viewport"><div class="viewbar"><div id="views"><button data-yaw="0" data-pitch="0">正面</button><button data-yaw="90" data-pitch="0">右側</button><button data-yaw="-90" data-pitch="0">左側</button><button data-yaw="-40" data-pitch="15" class="active">斜め</button><button data-yaw="0" data-pitch="80">上</button></div><label><input id="show-item" type="checkbox" checked>銃を表示</label></div><div id="stage"><img id="preview" alt="現在のアニメーションのプレビュー" draggable="false"><div id="render-status">読み込み中…</div></div><div class="viewhint">ドラッグで回転 · ホイールで拡大縮小<span id="camera-label"></span></div></section>
<aside class="inspector"><h2 id="bone-title">右腕</h2><p class="muted" id="bone-id">rightArm</p><div class="tabs"><button data-channel="rotation" class="active">回転</button><button data-channel="position">位置</button><button data-channel="scale">拡大率</button></div><div id="axes"></div><p class="muted" id="channel-hint"></p><div class="row"><button id="add-key" class="primary">この時刻にキーを置く</button><button id="delete-key">キーを削除</button></div><hr><h2>アニメーション</h2><label class="field">編集対象<select id="target"><option value="body">スティーブ</option><option value="item">銃</option></select></label><label class="field">長さ（秒）<input id="duration" type="number" min="0.05" max="300" step="0.05" value="1"></label><label class="field">再生の終わり<select id="loop"><option value="true">ループ</option><option value="false">1回だけ</option><option value="hold_on_last_frame">最後の姿勢で止める</option></select></label><label class="field">キーの補間<select id="interpolation"><option value="linear">直線</option><option value="catmullrom">なめらか</option><option value="step">切り替え</option></select></label><p class="muted">値を変えると現在の時刻にキーを作ります。位置は骨の向きに沿った移動量です。</p><details><summary>表示・保存について</summary><p>実際の模型とテクスチャをPythonで描画しています。ゲーム内の照明や状態機械、任意のMolang式は再現しません。</p><p>「散弾に保存」は選択中の体と銃のアニメをパックへ適用します。他の用途にはJSONを書き出してください。保存前のファイルはバックアップされます。</p></details></aside>
</main>
<section class="timeline"><div class="transport"><button id="play" class="primary">▶ 再生</button><button id="start">先頭へ</button><label>時刻 <input id="time" type="number" min="0" step="0.05" value="0"> 秒</label><label>速度 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><span class="muted">選択部位のキー</span><span id="key-count"></span></div><input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="再生位置"><div id="markers"></div><div id="ticks"></div></section>
<footer><span id="status" role="status">パックから読み込み中…</span><span id="dirty">保存済み</span></footer>
<input id="file" type="file" accept=".json" hidden><script type="module" src="/editor.js"></script></body></html>
